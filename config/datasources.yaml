# One entry per datasource. To add a new one:
#   1. write atlas/fetchers/<name>_fetcher.py (subclass Fetcher)
#   2. add an entry here
#   3. restart the runner
#
# Nothing in atlas/runner.py or atlas/registry.py needs to change.
# Every datasource lands in the same atlas.raw_ticks table (see
# atlas/db/schema.sql) -- `name` here is what becomes the `source`
# column, not a separate table per datasource.
#
# Optional `schedule:` block controls WHEN a datasource is allowed to
# fetch (checked before every poll, in Asia/Tehran time) -- outside the
# window, the runner just sleeps and rechecks, no fetch() call, no
# sink writes. Omit `schedule:` entirely for "always allowed" (the
# default, and what `example`/`example_scrape` use below).
#   workdays_only: true    -- Iran work week (Saturday-Wednesday) only
#   start: "HH:MM"          -- inclusive
#   end: "HH:MM"            -- inclusive

datasources:
  # IME (Iran Mercantile Exchange) live market -- real HTTP API, no auth.
  - name: ime
    module: atlas.fetchers.ime_fetcher
    class: IMEFetcher
    interval_s: 2
    enabled: true
    kwargs: {}
    schedule:
      workdays_only: true
      start: "12:00"
      end: "18:00"

  # Tadbir NAV feed for TSE gold funds -- public, no auth.
  - name: tadbir
    module: atlas.fetchers.nav_tadbir_fetcher
    class: NavTadbirFetcher
    interval_s: 20   # NAVDate only has minute resolution; no point polling faster
    enabled: true
    kwargs: {}
    schedule:
      workdays_only: true
      start: "12:00"
      end: "18:00"

  # Farabi NAV feed for TSE gold funds -- second provider fetch_nav.py
  # also polls. Needs a real trading account's auth token from the
  # local auto_farabi_fetch service (account_name below), same one
  # fetch_nav.py already depends on.
  - name: farabi
    module: atlas.fetchers.nav_farabi_fetcher
    class: NavFarabiFetcher
    interval_s: 20
    enabled: true
    kwargs:
      account_name: "Ahamdi_Farabi"
    schedule:
      workdays_only: true
      start: "12:00"
      end: "18:00"

  # estjt.ir gold/coin retail prices -- HTML scrape, no auth. No
  # schedule window set (unlike ime/tadbir/farabi) since this isn't
  # tied to TSE/IME trading hours; add one if it should be.
  - name: estjt
    module: atlas.fetchers.estjt_fetcher
    class: EstjtFetcher
    interval_s: 15
    enabled: false
    kwargs: {}

  # Wallex crypto/currency markets -- public HTTP API, no auth. Not
  # tied to TSE/IME trading hours, so no schedule window.
  - name: wallex
    module: atlas.fetchers.wallex_fetcher
    class: WallexFetcher
    interval_s: 10
    enabled: false
    kwargs:
      symbols: ["USDTTMN"]

  # goldprice.org international spot gold/silver (USD/oz) -- public,
  # but gated on Origin/Referer headers matching a real browser hit.
  # Not tied to TSE/IME trading hours, so no schedule window.
  - name: goldprice
    module: atlas.fetchers.goldprice_fetcher
    class: GoldpriceFetcher
    interval_s: 15
    enabled: false
    kwargs: {}

  - name: example
    module: atlas.fetchers.example_fetcher
    class: ExampleFetcher
    interval_s: 5
    enabled: false          # flip to true to smoke-test the pipeline
    kwargs:
      isins: ["DEMO1", "DEMO2"]

  # Template for datasources with no JSON API -- only a page to scrape.
  # Same Fetcher contract; only `fetch()`'s internals differ.
  - name: example_scrape
    module: atlas.fetchers.example_scrape_fetcher
    class: ExampleScrapeFetcher
    interval_s: 10
    enabled: false
    kwargs: {}
      # url: "https://example.com/prices"   # omit to use the offline demo HTML
