# One entry per datasource. To add a new one:
#   1. write atlas/fetchers/<name>_fetcher.py (subclass Fetcher)
#   2. add an entry here
#   3. restart the runner
#
# Nothing in atlas/runner.py or atlas/registry.py needs to change.
# Every datasource lands in the same atlas.raw_ticks table (see
# atlas/db/schema.sql) -- `name` here is what becomes the `source`
# column, not a separate table per datasource.

datasources:
  # IME (Iran Mercantile Exchange) live market -- real HTTP API, no auth.
  - name: ime
    module: atlas.fetchers.ime_fetcher
    class: IMEFetcher
    interval_s: 2
    enabled: true
    kwargs: {}
    redis:
      ttl_s: 30

  # Tadbir NAV feed for TSE gold funds -- public, no auth. Farabi (the
  # second provider fetch_nav.py also polls) needs a real account's
  # auth token and isn't built here yet -- see CLAUDE.md.
  - name: tadbir
    module: atlas.fetchers.nav_tadbir_fetcher
    class: NavTadbirFetcher
    interval_s: 20   # NAVDate only has minute resolution; no point polling faster
    enabled: false
    kwargs: {}
    redis:
      ttl_s: 60

  - name: example
    module: atlas.fetchers.example_fetcher
    class: ExampleFetcher
    interval_s: 5
    enabled: false          # flip to true to smoke-test the pipeline
    kwargs:
      isins: ["DEMO1", "DEMO2"]
    redis:
      ttl_s: 30

  # Template for datasources with no JSON API -- only a page to scrape.
  # Same Fetcher contract; only `fetch()`'s internals differ.
  - name: example_scrape
    module: atlas.fetchers.example_scrape_fetcher
    class: ExampleScrapeFetcher
    interval_s: 10
    enabled: false
    kwargs: {}
      # url: "https://example.com/prices"   # omit to use the offline demo HTML
    redis:
      ttl_s: 30
